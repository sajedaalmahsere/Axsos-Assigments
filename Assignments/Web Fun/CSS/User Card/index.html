<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>User Card</title>
</head>
<body>
    <div class="white-space">
        <div class="blue-space">
            <img src="/static/user-circle.png" alt="User">
            <h1>Jane Doe</h1>
            <div>
                <img class="map" src="/static/map-marker.png" alt="map">
                <p class="location">Seattle</p>
                
                <div class="info">
                <p >Develpoer | Engineer | Problem Solver</p>
                <p class="content" >Master of shadows and the Internet! </p>
                </div>

                <div class="edit-profile"> 
                <img class="settings" src="/static/gear.png" alt="settings">
                <a href="">edit profile</a>
                </div>
            
            </div>
        </div>
    </div>
</body>
</html>
