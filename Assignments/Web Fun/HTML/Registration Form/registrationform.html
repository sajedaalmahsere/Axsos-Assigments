<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>

    

</head>
<body>
    <form>
        <h1>Registration Form</h1>
        
        <div>
        <label for="username":>User Name: </label>
        <input type="text" name="username" id="username">
        </div>
        
    <br>
        
        <div>
        <label for="lastname":>Last Name: </label>
        <input type="text" name="lastname" id="lastname">
        </div>
    <br>
        <div>
        <label for="email":>Email: </label>
        <input type="text" name="email" id="email">
        </div>
    <br>
        <div>
        <label for="password">Password: </label>
        <input type="password" name="password" id="password">
        </div>
    <br>
        <div>
        <label for="confirm">Confirm Password: </label>
        <input type="password" name="password" id="confirm">
        </div>
    <br>
        <div>
        <label for="date">Birthday: </label>
        <input type="date" name="dob" id="date">
        </div>

        <div>
        <p>Gender identity: </p>
        <label for="male">Male</label>
        <input type="radio" name="gender" value="Male" id="male">
        <label for="Female">Female</label>
        <input type="radio" name="gender" value="Female" id="Female">
        <label for="nonbinary">Non-Binary</label>
        <input type="radio" name="gender" value="nonbinary" id="nonbinary">
        <label for="notanswer">I prefer not to answer</label>
        <input type="radio" name="gender" value="notanswer" id="notanswer">
        </div>
 
        <div>
        <p>A short discription about myself: </p>
        <textarea name="discription" cols="20" rows="3"></textarea>
        </div>
    <br>
        <div>
        <label for="language">Favorite Language:</label>
        <select id="language">
            <option value="js">JavaScript</option> 
            <option value="python">Python</option>
            <option value="c#">C#</option>
        </select>
        </div>
    <br>
        <div>
        <label for="recieveemail">Yes, I would like to recieve periodic email updates</label>
        <input type="checkbox" name="recieveemail" id="recieveemail">
        </div>
    <br>
        <div>
        
        <input type="submit" value="Creat Account">
                </div>
    <div>
    <p><strong>*Indicate a required field</strong></p>
    </div>
    
    </form>   
</body>
</html>
