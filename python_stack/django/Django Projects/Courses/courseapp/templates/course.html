<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet">
    <title>Document</title>
</head>
<body class="bg-light">
    <div class="container py-5 card shadow-sm border-0 rounded-3 m-5 p-4">
        <h1 class="fw-bold mb-4 text-primary">Add a new course</h1>

        <form action="/add_course/" method="post">
            {% csrf_token %}
            <div class="row mb-3 m-3">
                <label for="course_name" class="col-sm-2 col-form-label">
                    Name:
                </label>
                <div class="col-sm-10">
                    <input type="text" name="course_name"
                    id="course_name" class="form-control">
                </div>
            </div>

            <div class="row mb-3 m-3">
                <label for="description" class="col-sm-2 col-form-label">
                    Description:
                </label>
                <div class="col-sm-10">
                    <textarea name="description" id="description"
                    class="form-control"></textarea>
                </div>
            </div>

            <div class="text-end">
                <button type="submit" class="btn btn-primary px-4 m-3">Add Course</button>
            </div>
        </form>

        <table class="table table-hover table-striped align-middle">
            <thead class="table-primary">
                <tr>
                    <th>Course Name</th>
                    <th>Description</th>
                    <th>Date Added</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for course in course %}
                <tr>
                    <td>{{course.course_name}}</td>
                    <td>{{course.description}}</td>
                    <td>{{course.created_at}}</td>
                    <td>
                        <a href="/remove_course/{{course.id}}/"
                           class="btn btn-outline-danger btn-sm">Remove</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

        {% if messages %}
            {% for message in messages %}
                <p class="alert alert-info">{{message}}</p>
            {% endfor %}
        {% endif %}
    </div>
</body>
</html>
