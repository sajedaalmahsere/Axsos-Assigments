<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Read(All)</title>
</head>
<body>
    <h1>All Shows</h1>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Network</th>
                <th>Release Date</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for movie in movie %}
            <tr>
                <td>{{movie.id}}</td>
                <td>{{movie.title}}</td>
                <td>{{movie.network}}</td>
                <td>{{movie.release_date}}</td>
                <td>
                    <a href="/show/{{movie.id}}/">Show</a>
                    <a href="/edit/{{movie.id}}">Edit</a>
                    <a href="delete/{{movie.id}}/">Delete</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    <a href="/add_show/">Add a New Show</a>
</body>
</html>
