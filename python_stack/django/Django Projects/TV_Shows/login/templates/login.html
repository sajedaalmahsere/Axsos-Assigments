<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <title>TV Shows</title>
</head>
<body>
    <body class="container mt-5">
        <h1>NEXTFIX</h1>
    <div class="row">
        <div class="col-md-6">
            <form action="/register/" method="post" class="card card-body">
                <h2 class="fw-bold fg-primary">Registration</h2>
                {% csrf_token %}
                <div class="row">
                    <div  class="col-md-6 mb-3">
                        <label for="first_name">First Name</label>
                        <input type="text" name="first_name" id="first_name"  class="form-control">
                    </div>
                    <div class="col-md-6 mb-3">
                            <label for="last_name">Last Name</label>
                            <input type="text" name="last_name" id="last_name"  class="form-control">
                    </div>
                </div>
                <div class="mb-3">
                    <label for="email">Email</label>
                    <input type="email" name="email" id="email"  class="form-control">
                </div>
                <div class="mb-3">
                    <label for="password">Password</label>
                    <input type="password" name="password" id="password"  class="form-control">
                </div>
                <div class="mb-3">
                    <label for="confirm_password">Confirm PW</label>
                    <input type="password" name="confirm_password" id="confirm_password"  class="form-control">
                </div>
                        <input type="submit" value="Submit"  class="btn btn-primary">
                    </form>
                </div>
        <div class="col-md-6">
            <form action="/login/" method="post" class="card card-body">
                <h2 class="fw-bold fg-primary">Login</h2>
                {% csrf_token %}
                <div class="mb-3">
                    <label for="email">Email</label>
                    <input type="email" name="email" id="email"  class="form-control">
                </div>
                <div class="mb-3">
                    <label for="password">Password</label>
                    <input type="password" name="password" id="password"  class="form-control">
                </div>
                
                <input type="submit" value="Submit" class="btn btn-primary">
                
            </form>
        </div>
        {% if messages %}{% for message in messages %}
        <p>{{message}}</p>
        {% endfor %}
        {% endif %}
    </div>
</body>
</html>
