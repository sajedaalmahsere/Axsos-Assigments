<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dojo Survey</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="card shadow mx-auto" style="max-width: 600px;">
            <div class="card-header bg-primary text-white text-center py-3">
                <h1 class="h3 mb-0">Dojo Survey</h1>
            </div>
            <div class="card-body p-4">
                <form action="/register/" method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="name" class="form-label">Your Name:</label>
                        <input type="text" name="name" id="name" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label for="location" class="form-label">Dojo Location:</label>
                        <select name="location" id="location" class="form-select">
                            <option value="san_jose">San Jose</option>
                            <option value="jerusalem">Jerusalem</option>
                            <option value="hebron">Hebron</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="language" class="form-label">Favorite Language:</label>
                        <select name="language" id="language" class="form-select">
                            <option value="PY">Python</option>
                            <option value="JS">JavaScript</option>
                            <option value="Java">Java</option>
                        </select>
                    </div>
                    <div class="mb-4">
                        <label for="comment" class="form-label">Comment (optional):</label>
                        <textarea name="comment" id="comment" class="form-control" rows="4"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Submit Survey</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
