<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <div class="row">
    <div class="col-md-6">
    <h2>Add a Dojo</h2>
        <form action="/dojo/" method="post" class="card card-body">
            {% csrf_token %}
            <label for="name">Name:</label>
            <input type="text" name="name" id="name" class="form-control">
            
            <label for="city">City:</label>
            <input type="text" name="city" id="city" class="form-control">
            
            <label for="state">State:</label>
            <input type="text" name="state" id="state" class="form-control">
            <br>
            <input type="submit" value="Add" class="btn btn-primary">
    </form>
    </div>
    <div class="col-md-6">
    <h2>Add a Ninja</h2>
    <form action="/ninja/" method="post" class="card card-body">
        {% csrf_token %}
        <label for="first_name">First Name:</label>
        <input type="text" name="first_name" id="first_name" class="form-control">
        
        <label for="last_name">Last Name:</label>
        <input type="text" name="last_name" id="last_name" class="form-control">
        <br>
        <select name="dojo_id" id="dojo_id" class="form-select">Dojo:
            {% for dojo in dojoes %}
            <option value="{{dojo.id}}">{{dojo.name}}</option>
            {% endfor %}
        </select>
        <br>
        <input type="submit" value="Add" class="btn btn-primary">
    </form>
    </div>
    </div>
    <br>
    <ul class="list-group list-group-flush">
        {% for dojo in dojoes %}
            <li class="list-group-item">{{dojo.name}}</li>
            <ul class="list-group">
                {% for ninja in dojo.ninjaes.all %}
                <li class="list-group-item">{{ninja.first_name}} {{ninja.last_name}}</li>
                {% endfor %}
            </ul>
        {% endfor %}
    </ul>
</body>
</html>
